<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: Arial, sans-serif;
        background: white;
    }
    .navbar{
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 25px 10%;
        background: white;
    }
    .logo{
        color: black;
        font-size: 32px;
        font-weight: bold;
    }
    .search {
        width: 45%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: cornflowerblue;
    }
    button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #0c831f;
    color: white;
    cursor: pointer;
}
.banner {
    margin: 20px auto;
    width: 88%;
    padding: 55px 30px;
    border-radius: 15px;
    background: linear-gradient(90deg, #063d25, #168447);
    color: white;
}

.banner h1 {
    font-size: 35px;
    margin-bottom: 15px;
}

.banner p {
    font-size: 18px;
    margin-bottom: 20px;
}

.offers {
    display: flex;
    gap: 15px;
    width: 88%;
    margin: 25px auto;
}

.card {
    flex: 1;
    padding: 30px 15px;
    border-radius: 15px;
    min-height: 160px;
}

.card h2 {
    font-size: 21px;
    margin-bottom: 15px;
}

.one {
    background: #20c5c5;
}

.two {
    background: #f5c34b;
}

.three {
    background: #b9d9ed;
}
.categories {
    width: 88%;
    margin: 35px auto;
}
.products {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
}

.item {
    background: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
}

.item .emoji {
    font-size: 45px;
    margin-bottom: 10px;
}

.item p {
    font-size: 14px;
    font-weight: bold;
}


</style>
</head>
<div class="navbar">
    <div class ="logo">blinkit</div>
    <h1>Delivery in 30 minutes</h1>
    
    <input class="search" type="text"placeholder="Search"product products">
    <button>Login</button>
</div>
<div class="banner">
    <h2>Stock up on daily essentials</h2>
    <p>Get farm-fresh fruits, vegetables,eggs,Chocolate & more</p>
    <button>Shop Now</button>
</div>
<div class="offers">

    <div class="card one">
        <h2>Pharmacy at your doorstep!</h2>
        <button>Order Now</button>
    </div>
    <div class="Card two">
        <h2>Pet care supplies at your door</h2>
        <button>Order Now</button>
        </div>
        <div class="card three">
        <h2>No time for a diaper run</h2>
        <button>Order Now</button>
    </div>

</div>

<div class="categories">
    <h2>Shop by Category</h2>

    <div class="products">

        <div class="item">
            <div class="emoji">🧴</div>
            <p>Beauty & Cosmetics</p>
        </div>

        <div class="item">
            <div class="emoji">🍪</div>
            <p>Daily Needs & Snacks</p>
        </div>

        <div class="item">
            <div class="emoji">🥦</div>
            <p>Fruits & Vegetables</p>
        </div>


</div>
<body>
    
</body>
</html>
